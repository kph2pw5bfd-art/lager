/* Lager Assistent (ab 1.72) – im Stil der restlichen App (vorher dunkles HUD) */
body.jvon main{max-width:1100px}
.jv{display:flex;flex-direction:column;gap:12px}
.jvhead{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.jvhrow{display:flex;align-items:center;gap:12px}
.jvmini{flex:0 0 44px;color:var(--navy);display:grid;place-items:center}
.jvmini .r1,.jvmini .r2,.jvmini .core{transform-origin:26px 26px}
.jvmini .r1{animation:jvccw 40s linear infinite}.jvmini .r2{animation:jvcw 18s linear infinite}
.jv.talk .jvmini .core{animation:jvtalk .45s ease-in-out infinite}.jv.talk .jvmini .r2{animation-duration:5s}
.jvtime{flex:1;min-width:0;display:flex;flex-direction:column}
.jvclock{font-size:clamp(34px,9vw,46px);font-weight:800;line-height:1.05;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.jvdate{font-size:14px;color:var(--mute);margin-top:2px}
.jvbrief{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:12px 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;min-height:46px}
.jv.talk .jvbrief{background:var(--bad)}
.jvgreet{font-size:15px;font-weight:600}
.jvopts{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.jvlink{background:none;border:0;color:var(--navy);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:4px 2px}
.jvgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.jvcol{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:760px){.jvgrid{grid-template-columns:minmax(0,1fr)}}
.jvpn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.jvpn.al{border:1.5px solid var(--bad)}.jvpn.dim{opacity:.6}
.jvlb{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:700;margin-bottom:8px}.jvlb span{margin-left:auto;font-size:12px;font-weight:400;color:var(--mute)}
.jvstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;margin-bottom:4px}
.jvstat{border:1px solid var(--line);border-radius:8px;padding:8px 4px}.jvstat .n{font-size:26px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}.jvstat .t{font-size:11.5px;color:var(--mute);line-height:1.25}
.jvstat.al{border:1.5px solid var(--bad);background:#fbebeb}.jvstat.al .n{color:var(--bad)}.jvstat.al .t{color:#7c1f19}
.jvrow{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;padding:9px 0;cursor:pointer}
.jvrow span:first-child{min-width:0;overflow-wrap:anywhere;font-weight:600}.jvrow span:last-child{flex:none;text-align:right;font-size:12.5px}
.jvrow .ok{color:var(--mute)}.jvrow .warn{color:var(--bad);font-weight:700}
.jvempty{font-size:14px;color:var(--mute);padding:4px 0}
.jvnote{font-size:12px;color:var(--mute);margin:4px 0 0}
@keyframes jvcw{to{transform:rotate(360deg)}}@keyframes jvccw{to{transform:rotate(-360deg)}}

/* ===== Meine Aufträge (1.85) ===== */
.abtag.blue{background:var(--tint);color:var(--navy)}
.aug{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 8px;color:var(--navy)}.aug b{font-size:16px}.aug small{color:var(--mute);font-size:13px}
.audiv{height:3px;background:var(--navy);border-radius:2px;margin:16px 0 12px}
.aucard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.aucard.mine{border-color:#9db6dc}.aucard.hot{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.auct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.auct b{min-width:0;font-size:15px;overflow-wrap:anywhere}
.aus{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.aus i{display:block;height:6px;border-radius:3px;background:var(--line)}
.aus i.d{background:var(--navy)}.aus i.n{background:#7ea3d8}.aus i.w{background:#e67e22}.aus i.r{background:var(--bad)}
.aul{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;font-size:10px;color:var(--mute);text-align:center}
.aupills{display:flex;flex-wrap:wrap;gap:4px}
.aucd{display:flex;flex-direction:column;gap:6px}.aucd.red{border-color:var(--bad)}.aucd.unread{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.ausec{color:var(--navy);font-size:14px;border-bottom:2px solid var(--tint);padding-bottom:4px}.ausec.red{color:var(--bad)}
.aukv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.aukv span{color:var(--mute)}
.autl{display:flex;flex-direction:column}
.aute{display:grid;grid-template-columns:22px 1fr;gap:9px;position:relative;padding-bottom:12px}.aute:last-child{padding-bottom:0}
.aute:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.aute b{font-size:14px}.aute small{display:block;color:var(--mute);font-size:13px;line-height:1.4}
.audev{display:block;color:var(--ink);margin-top:2px}
.audot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--card);border:2px solid var(--line);box-sizing:border-box}
.audot.d{background:var(--navy);border-color:var(--navy)}.audot.n{background:#7ea3d8;border-color:#7ea3d8}.audot.w{background:#e67e22;border-color:#e67e22}.audot.r{background:var(--bad);border-color:var(--bad)}
.aurow{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}.auq{min-width:34px;color:var(--bad);font-variant-numeric:tabular-nums}.auq.m{color:var(--mute)}
.aun{flex:1;min-width:0;overflow-wrap:anywhere}.aun small{display:block;font-size:12px}.aust{font-size:13px;color:var(--ok);white-space:nowrap}
.auab{width:auto;flex:none}
.auans{background:var(--tint);border-radius:8px;padding:7px 9px;font-size:13px;line-height:1.4}.auans small{display:block;color:var(--mute);font-size:12px;margin-top:2px}.auans.s{margin-top:4px}
.aumat>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline}.aumat>summary::-webkit-details-marker{display:none}.aumat>summary b{color:var(--navy)}.aumat>summary b:after{content:" ▸";color:var(--mute)}.aumat[open]>summary b:after{content:" ▾"}
.audlg{width:100%;max-width:440px;margin:0;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.auopt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;cursor:pointer}
.auopt i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--mute);margin-top:1px;box-sizing:border-box}
.auopt.on{border-color:var(--navy);background:var(--tint)}.auopt.on i{border-color:var(--navy);background:radial-gradient(var(--navy) 42%,transparent 48%)}
.auopt small{display:block;color:var(--mute);font-size:12px}.auopt small.auto{color:var(--navy);font-weight:600}.auopt input{margin-top:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .aug,:root:not([data-theme="light"]) .ausec:not(.red),:root:not([data-theme="light"]) .aumat>summary b,:root:not([data-theme="light"]) .auopt small.auto{color:#8fb0ea}:root:not([data-theme="light"]) .auans,:root:not([data-theme="light"]) .auopt.on,:root:not([data-theme="light"]) .abtag.blue{background:#1d3550}:root:not([data-theme="light"]) .abtag.blue{color:#8fb0ea}}
:root[data-theme="dark"] .aug,:root[data-theme="dark"] .ausec:not(.red),:root[data-theme="dark"] .aumat>summary b{color:#8fb0ea}:root[data-theme="dark"] .auans,:root[data-theme="dark"] .auopt.on,:root[data-theme="dark"] .abtag.blue{background:#1d3550}
.aucd .aun{color:var(--ink)}#aumsg{margin-bottom:10px}
.aurow .auq{min-width:62px;white-space:nowrap}.aurow .auq small{font-size:12px;font-weight:600}
/* Zusatz-Packscheine (1.88) */
.pkzday{margin:4px 0 6px;padding:8px 10px;border-radius:8px;background:#fff6ea;border:1px solid #f0c48a;display:flex;flex-direction:column;gap:6px}
.pkzday.late{background:#fbebeb;border-color:var(--bad)}.pkzday.fin{background:#e3f3e9;border-color:#9fdcb4}
.pkzdl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.pkzdl em{color:var(--bad);font-style:normal;font-weight:700}.pkzdl small{color:var(--mute)}.pkzdl .btn{width:auto;flex:none}
.pkzdp{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pkzdp .pkmb{flex:1;min-width:140px}.pkzdp .ok{color:#1f6b41}
.pkzfoot{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.pkzfoot .btn{width:auto;flex:1}
.pkzq{margin-bottom:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pkzday{background:#3d2410;border-color:#7a4a1c}:root:not([data-theme="light"]) .pkzday.late{background:#3d1d1d}:root:not([data-theme="light"]) .pkzday.fin{background:#16402a;border-color:#2a6b45}}
:root[data-theme="dark"] .pkzday{background:#3d2410;border-color:#7a4a1c}:root[data-theme="dark"] .pkzday.late{background:#3d1d1d}:root[data-theme="dark"] .pkzday.fin{background:#16402a;border-color:#2a6b45}

<script>const APPV="1.88";

/* ===== Verbindung zu Supabase (ersetzt die Claude-Datenbank) ===== */
const RECOVERY=/type=recovery/.test(location.hash);
const SB_URL="https://whfeipnyzffrejbakweb.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoZmVpcG55emZmcmVqYmFrd2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNjE3MjUsImV4cCI6MjEwODczNzcyNX0.aUo3d2SyIzFX5-a4vQa37FxaBMBI10CzFfnF9roHl0U";
const SB=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const HERE=location.origin+location.pathname;
let ME=null,PROF=null,PROFS=[];
const LIVE=["lists","artikel","defekte","infos","werkstatt","users","lager","retour","rkat","titel","rolle"];
const DBX=(()=>{const subs={};let ch=null;
 const snap=s=>({docs:[...s.rows.values()].map(r=>({id:r.id,data:()=>r.data}))});
 const emit=c=>{const s=subs[c];if(!s||!s.ready)return;const v=snap(s);s.cbs.slice().forEach(f=>{try{f(v)}catch(e){console.error(e)}})};
 async function load(c){const s=subs[c];let all=[],from=0;for(;;){const {data,error}=await SB.from("docs").select("id,data").eq("col",c).range(from,from+999);if(error){console.error(error);return}all=all.concat(data);if(data.length<1000)break;from+=1000}s.rows=new Map(all.map(r=>[r.id,r]));s.ready=true;emit(c)}
 const put=(c,id,data)=>{const s=subs[c];if(s){s.rows.set(id,{id,data});emit(c)}};
 const del=(c,id)=>{const s=subs[c];if(s&&s.rows.delete(id))emit(c)};
 const reload=()=>Object.keys(subs).forEach(load);
 function listen(){if(ch)return;const f="col=in.("+LIVE.join(",")+")";
  ch=SB.channel("docs-live")
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"docs",filter:f},p=>p.new&&put(p.new.col,p.new.id,p.new.data))
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"docs",filter:f},p=>p.new&&put(p.new.col,p.new.id,p.new.data))
   .on("postgres_changes",{event:"DELETE",schema:"public",table:"docs"},p=>p.old&&del(p.old.col,p.old.id))
   .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>loadProfs())
   .subscribe(st=>{if(st==="SUBSCRIBED")reload()})}
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ME){reload();loadProfs()}});
 window.addEventListener("online",()=>{if(ME){reload();loadProfs()}});
 const api={reloadAll:()=>reload(),
  collection:c=>({onSnapshot(cb){let s=subs[c];if(!s){s=subs[c]={rows:new Map(),cbs:[],ready:false};load(c)}s.cbs.push(cb);if(s.ready)cb(snap(s));listen();return()=>{s.cbs=s.cbs.filter(f=>f!==cb)}},doc:id=>api.doc(c+"/"+id)}),
  doc:p=>{const i=p.indexOf("/"),c=p.slice(0,i),id=p.slice(i+1);return{
   async set(d){const {data,error}=await SB.from("docs").upsert({col:c,id,data:d,updated_at:new Date().toISOString()}).select("data").single();if(error)throw error;put(c,id,data.data)},
   async update(pt){const {data,error}=await SB.rpc("doc_update",{p_col:c,p_id:id,p_patch:pt});if(error)throw error;put(c,id,data)},
   async delete(){const {error}=await SB.from("docs").delete().eq("col",c).eq("id",id);if(error)throw error;del(c,id)},
   async get(){const {data,error}=await SB.from("docs").select("data").eq("col",c).eq("id",id).maybeSingle();if(error)throw error;return{exists:!!data,data:()=>data?data.data:undefined}}}}};
 return api})();
const USERX={id:async()=>ME.id,isOwner:async()=>!!PROF&&PROF.role==="admin",
 profiles:async ids=>{const o={};if(!ids||!ids.length)return o;const {data}=await SB.from("profiles").select("id,name").in("id",ids);(data||[]).forEach(p=>o[p.id]={name:p.name});return o}};
const DLX={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}};
window.claude={use:async n=>n==="db"?DBX:n==="user"?USERX:n==="downloads"?DLX:null};

async function loadProfs(){const {data}=await SB.from("profiles").select("id,name,email,role,active,created_at").order("created_at");PROFS=data||[];const mine=PROFS.find(p=>p.id===(ME&&ME.id));if(mine){PROF=mine;PROFS.forEach(p=>{if(p.name)names[p.id]=p.name})}if(typeof draw==="function"&&db)draw()}
const profActive=i=>{const p=PROFS.find(x=>x.id===i);return !p||p.active};
const pendingN=()=>PROFS.filter(p=>!p.active).length;

/* ===== Anmeldung ===== */
function authErr(e){const m=String(e&&(e.message||e.error_description)||e||"");
 if(/invalid login/i.test(m))return "E-Mail oder Passwort ist falsch.";
 if(/already registered|already exists/i.test(m))return "Für diese E-Mail gibt es schon ein Konto. Bitte anmelden.";
 if(/not confirmed/i.test(m))return "Bitte zuerst die E-Mail bestätigen. Der Link ist in deinem Postfach.";
 if(/at least|password should/i.test(m))return "Das Passwort muss mindestens 6 Zeichen haben.";
 if(/rate limit|too many/i.test(m))return "Zu viele Versuche. Bitte ein paar Minuten warten.";
 if(/provider is not enabled|unsupported provider/i.test(m))return "Die Google-Anmeldung ist noch nicht eingerichtet. Bitte mit E-Mail anmelden.";
 if(/valid email|invalid.*email/i.test(m))return "Bitte eine gültige E-Mail-Adresse eingeben.";
 if(/fetch|network/i.test(m))return "Keine Verbindung. Bitte Internet prüfen.";
 return "Das hat nicht geklappt: "+m}
const GSVG='<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function authShell(title,html){$("#t").textContent=title;$("#bk").hidden=true;$("#who").textContent="";$("#app").innerHTML='<div class="authw">'+html+'</div>'}
function loginView(){authShell("Anmelden",'<div class="card"><label class="mute" for="le">E-Mail</label><input id="le" type="email" autocomplete="username" inputmode="email"><label class="mute" for="lp">Passwort</label><input id="lp" type="password" autocomplete="current-password"><button class="btn" id="lb">Anmelden</button></div><div class="authl"><button class="lnk" id="lr">Neues Konto erstellen</button><button class="lnk" id="lf">Passwort vergessen?</button></div>');
 const go=async()=>{const e=$("#le").value.trim(),p=$("#lp").value;if(!e||!p)return errBox("Bitte E-Mail und Passwort eingeben.");$("#lb").disabled=true;const {data,error}=await SB.auth.signInWithPassword({email:e,password:p});$("#lb")&&($("#lb").disabled=false);if(error)return errBox(authErr(error));ME=data.user;afterLogin()};
 $("#lb").onclick=go;$("#lp").onkeydown=e=>{if(e.key==="Enter")go()};
 $("#lr").onclick=registerView;$("#lf").onclick=forgotView}

/* ===== Aufkleber-Foto mit Texterkennung am Gerät ===== */
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector('script[src="'+src+'"]'))return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function parseLabel(t){const L=String(t).split(/\n/).map(x=>x.replace(/[|\[\]{}]/g," ").replace(/\s+/g," ").trim()).filter(Boolean),NR=/(\d{5,9})\s?[-–—]\s?(\d{1,3})(?!\d)/;let on="",ni=-1,pi=-1;
 for(let i=0;i<L.length;i++){if(/telefon|tel\.|\+43|fax|stra(ss|ß|b)e/i.test(L[i]))continue;const m=L[i].match(NR);if(m){on=m[1]+"-"+m[2];ni=i;break}}
 if(!on)for(let i=0;i<L.length;i++){const m=L[i].match(/auftrags?\s*[-.]?\s*(?:nr|nummer|no)\.?\s*[:.\-]?\s*(.*)$/i);if(m){on=((m[1]||"").trim()||(L[i+1]||"")).replace(/[^A-Za-z0-9\-\/]/g,"");ni=i;break}}
 for(let i=0;i<L.length;i++)if(/^(projekt|veranstaltung)\b/i.test(L[i])){pi=i;break}
 const st=pi>=0?pi:ni,parts=[];
 if(st>=0)for(let i=st;i<L.length;i++){let l=L[i];if(i===st&&pi<0)continue;if(i>st&&/^(auftrag|gewicht)/i.test(l))break;
  l=l.replace(/^(projekt|veranstaltung)\s*[:.]?\s*/i,"").replace(/gewicht\s*:?/ig,"").replace(/\bkg\b/ig,"").trim();
  if(!parts.length&&NR.test(l))continue;if((l.match(/[A-Za-zÄÖÜäöüß]/g)||[]).length<2)continue;parts.push(l)}
 const ev=parts.slice(0,4).reduce((a,p)=>a?(/-$/.test(a)?a+p:a+" "+p):p,"");
 return{ev,on}}

/* Liest Auftragsnummer und Veranstaltung über Zeilengröße und Erkennungssicherheit */
function parseLabelData(d){const NR=/(\d{5,9})\s?[-–—]\s?(\d{1,3})(?!\d)/,fb=parseLabel(d.text||"");
 const wh=w=>w.bbox.y1-w.bbox.y0,lines=(d.lines||[]).map(l=>{const ws=(l.words||[]).filter(w=>w.confidence>=15&&/[A-Za-zÄÖÜäöüß0-9]/.test(w.text));return{ws,t:ws.map(w=>w.text).join(" ").trim(),y0:l.bbox.y0,y1:l.bbox.y1,h:Math.max(0,...ws.map(wh)),raw:l.text||""}}).filter(l=>l.t);
 const nl=lines.find(l=>NR.test(l.t)&&!/telefon|tel\.|\+43|fax/i.test(l.raw));if(!nl)return fb;
 const m=nl.t.match(NR),on=m[1]+"-"+m[2];
 const parts=lines.filter(l=>l.y0>nl.y0+nl.h*.5).map(l=>l.ws.filter(w=>wh(w)>=nl.h*.55&&w.confidence>=20).map(w=>w.text).join(" ")).map(t=>t.replace(/^(projekt|veranstaltung)\s*[:.]?\s*/i,"").replace(/gewicht\s*:?/ig,"").replace(/\bkg\b/ig,"").replace(/[^A-Za-zÄÖÜäöüß0-9&.,'\/\- ]/g,"").replace(/\s+/g," ").trim()).filter(t=>(t.match(/[A-Za-zÄÖÜäöüß]/g)||[]).length>=2||(t.match(/\d/g)||[]).length>=2).slice(0,4).map(t=>t.charAt(0).toUpperCase()+t.slice(1));
 const ev=parts.reduce((a,p)=>a?(/-$/.test(a)?a+p:a+" "+p):p,"");
 return{on,ev}}

/* Bild für die Texterkennung vorbereiten: verkleinern, grau, Kontrast strecken */
function ocrPrep(file,W){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,W/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
 const d=g.getImageData(0,0,c.width,c.height),a=d.data,n=a.length/4,H=new Uint32Array(256),Y=new Uint8Array(n);for(let i=0;i<n;i++){const y=(a[i*4]*299+a[i*4+1]*587+a[i*4+2]*114)/1000|0;Y[i]=y;H[y]++}
 let lo=0,hi=255,acc=0;const cut=n*.02;while(lo<255&&(acc+=H[lo])<cut)lo++;acc=0;while(hi>0&&(acc+=H[hi])<cut)hi--;const sp=Math.max(1,hi-lo);
 for(let i=0;i<n;i++){const v=Math.max(0,Math.min(255,(Y[i]-lo)*255/sp));a[i*4]=a[i*4+1]=a[i*4+2]=v}g.putImageData(d,0,0);c.toBlob(b=>b?ok(b):no(new Error("img")),"image/jpeg",.9)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("img"))};im.src=u})}
let TW=null;
const ocrScore=r=>(r.on?10:0)+(r.ev.match(/[A-Za-zÄÖÜäöüß]/g)||[]).length-(/-$/.test(r.ev)?6:0);
const LNR=/(\d{5,9})\s?[-–—]\s?(\d{1,3})(?!\d)/;
const ocrLines=d=>(d.lines||[]).map(l=>({t:l.text.trim(),y0:l.bbox.y0,y1:l.bbox.y1,w:(l.words||[]).map(w=>[w.text,Math.round(w.confidence),w.bbox.y1-w.bbox.y0])}));
async function ocrRun(blob,psm){await TW.setParameters({tessedit_pageseg_mode:psm});return(await TW.recognize(blob)).data}
async function readLabel(file,opt){await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");if(!TW)TW=await Tesseract.createWorker("deu");
 const base=await ocrPrep(file,1000),log=[];let d=null,nl=null,blob=base;
 for(const rot of [0,90,270,180]){const b=rot?await rotBlob(base,rot):base;
  for(const psm of rot?["3"]:["3","11"]){const r=await ocrRun(b,psm);log.push({step:"voll",rot,psm,lines:ocrLines(r)});nl=(r.lines||[]).find(l=>LNR.test(l.text)&&!/telefon|tel\.|\+43|fax/i.test(l.text)&&(l.words||[]).some(w=>LNR.test(w.text)||/\d{5}/.test(w.text))&&(l.words||[]).filter(w=>/\d{3}/.test(w.text)).every(w=>(w.bbox.x1-w.bbox.x0)>(w.bbox.y1-w.bbox.y0)*1.8));if(nl){d=r;blob=b;break}}
  if(nl)break}
 let best;
 if(!nl){best={on:"",ev:""};for(const W of [700,1300]){const r=await ocrRun(await ocrPrep(file,W),"3"),x=parseLabelData(r);log.push({step:"groesse",W,lines:ocrLines(r),r:x});if(ocrScore(x)>ocrScore(best))best=x}}
 else{const m=nl.text.match(LNR),on=m[1]+"-"+m[2],nh=Math.max(10,...(nl.words||[]).filter(w=>/\d/.test(w.text)).map(w=>w.bbox.y1-w.bbox.y0));
  if(opt&&opt.onlyNr){ocrSaveLog(log,{on,ev:""},blob);return{on,ev:""}}
  const im=await createImageBitmap(blob),y0=Math.min(im.height-1,Math.round(nl.bbox.y1+nh*.25)),y1=Math.min(im.height,Math.round(nl.bbox.y1+nh*12));
  const c=document.createElement("canvas");c.width=im.width;c.height=Math.max(1,y1-y0);c.getContext("2d").drawImage(im,0,y0,c.width,c.height,0,0,c.width,c.height);
  const cb=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));let ev="";
  for(const psm of ["4","6"]){const r=await ocrRun(cb,psm);
   const parts=(r.lines||[]).map(l=>(l.words||[]).filter(w=>w.confidence>=20&&/[A-Za-zÄÖÜäöüß0-9]/.test(w.text)&&(w.bbox.y1-w.bbox.y0)>=nh*.55).map(w=>w.text).join(" ").replace(/gewicht\s*:?/ig,"").replace(/\bkg\b/ig,"").replace(/[^A-Za-zÄÖÜäöüß0-9&.,'\/\- ]/g,"").replace(/\s+/g," ").trim())
    .filter(t=>t&&!/^proje/i.test(t)&&((t.match(/[A-Za-zÄÖÜäöüß]/g)||[]).length>=2||(t.match(/\d/g)||[]).length>=2)).slice(0,4).map(t=>t.charAt(0).toUpperCase()+t.slice(1));
   ev=parts.reduce((a,p)=>a?(/-$/.test(a)?a+p:a+" "+p):p,"");log.push({step:"ausschnitt",psm,lines:ocrLines(r),ev});if(ev&&!/-$/.test(ev))break}
  if(!ev)ev=parseLabelData(d).ev;best={on,ev}}
 ocrSaveLog(log,best,blob);return best}
async function ocrSaveLog(log,best,blob){try{const id="o"+Date.now().toString(36),img=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});

function rotBlob(blob,deg){return new Promise(async(ok,no)=>{try{const im=await createImageBitmap(blob),q=deg%180!==0,c=document.createElement("canvas");c.width=q?im.height:im.width;c.height=q?im.width:im.height;const g=c.getContext("2d");g.translate(c.width/2,c.height/2);g.rotate(deg*Math.PI/180);g.drawImage(im,-im.width/2,-im.height/2);c.toBlob(b=>b?ok(b):no(new Error("rot")),"image/jpeg",.92)}catch(e){no(e)}})}
/* Eigene Kamera für Etiketten: hintere Kamera, Rahmen, nur der Rahmenbereich wird verwendet */

 return new Promise(res=>{const end=b=>{st.getTracks().forEach(t=>t.stop());o.remove();res(b)};
  o.querySelector(".lx").onclick=()=>end(null);o.querySelector(".lg").onclick=()=>end(undefined);
  o.querySelector(".lshot").onclick=()=>{const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return;const vr=v.getBoundingClientRect(),fr=o.querySelector(".lframe").getBoundingClientRect(),sc=Math.max(vr.width/vw,vr.height/vh),ox=(vr.width-vw*sc)/2,oy=(vr.height-vh*sc)/2,m=.12;

   const c=document.createElement("canvas");c.width=Math.round(w);c.height=Math.round(h);c.getContext("2d").drawImage(v,x0,y0,w,h,0,0,c.width,c.height);o.querySelector(".lshot").disabled=true;c.toBlob(b=>end(b),"image/jpeg",.93)}})}

function rScanBind(){const b=$("#rscan"),f=$("#rscanf");if(!b)return;
 const run=async file=>{b.disabled=true;toast("Etikett wird gelesen …",1);try{const r=await readLabel(file,{onlyNr:true});if(!r.on)return errBox("Keine Auftragsnummer erkannt. Bitte nochmal gerade von vorne fotografieren.");rOpenByNr(r.on)}catch(e){console.error(e);errBox("Das Etikett konnte nicht gelesen werden. Bitte nochmal versuchen.")}finally{if($("#rscan"))$("#rscan").disabled=false}};
 b.onclick=async()=>{const shot=await labelCam();if(shot===undefined)return f.click();if(shot)run(shot)};f.onchange=()=>{const x=f.files[0];f.value="";if(x)run(x)}}
function rOpenByNr(on){rf="alle";const n=rNorm(on),hit=rets.filter(r=>rNorm(r.ord)===n);
 if(hit.length===1){curRet=hit[0].id;go("retopen");toast("Retourschein "+on+" geöffnet",1);return}

 if(!hit.length&&!rets.some(r=>rNorm(r.ord).startsWith(rNorm(base))))ask2("Kein Retourschein mit Auftragsnummer "+on+" gefunden.","Neuen Retourschein anlegen","Abbrechen",()=>{rqv="";rNew();rs.ord=on;retEdit()},()=>{rqv="";if($("#rsq"))$("#rsq").value="";if($("#rlist"))rListBody()})}

/* Kachelbeschriftung: doppelte Gruppenwörter weglassen, Schrift an die Kachel anpassen */

function rFit(){requestAnimationFrame(()=>document.querySelectorAll(".rtile b").forEach(el=>{el.style.fontSize="";let fs=parseFloat(getComputedStyle(el).fontSize),n=0;const lh=1.18,max=3;

   Jede Person speichert nur ihren eigenen Anteil im Feld pa_<Benutzer-ID> (JSON wie itemsJson, Mengen dürfen negativ sein = Korrektur).
   itemsJson bleibt der Grundstand (ältere Scheine). Angezeigt wird Grundstand + alle Anteile.
   Die Datenbank führt Felder per doc_update zusammen, darum überschreibt niemand den Anteil eines anderen.
   ed_<Benutzer-ID> = Zeitstempel "arbeitet gerade daran". */
function rJ(x){try{return JSON.parse(x||"{}")||{}}catch(e){return{}}}
function rCp(o){return JSON.parse(JSON.stringify(o||{}))}
function rAddTo(t,src){Object.keys(src||{}).forEach(k=>{const x=src[k];if(!x||typeof x!=="object")return;if(!t[k])t[k]={...x,q:0};else{const q=t[k].q;Object.assign(t[k],x);t[k].q=q}t[k].q+=(+x.q||0)})}
function rPos(t){const o={};Object.keys(t).forEach(k=>{if(t[k].q>0)o[k]=t[k]});return o}
function rView(r){const t={};r._base=r.itemsJson||"{}";rAddTo(t,rJ(r._base));Object.keys(r).forEach(k=>{if(k.startsWith("pa_"))rAddTo(t,rJ(r[k]))});Object.values(t).forEach(x=>{if(x.g==="Händisch")x.g="Manuell"});r.itemsJson=JSON.stringify(rPos(t));return r}
function rOthers(r){const t={};rAddTo(t,rJ(r._base));Object.keys(r).forEach(k=>{if(k.startsWith("pa_")&&k!=="pa_"+me)rAddTo(t,rJ(r[k]))});return t}
function rEd(r){const it=rIt(r);return{id:r.id,ev:r.ev,ord:r.ord||"",items:it,rem:r.rem||"",mine:rJ(r["pa_"+me]),view:rCp(it),h0:{ev:r.ev||"",ord:r.ord||"",rem:r.rem||""}}}
/* eigene Änderungen seit dem letzten Abgleich in den eigenen Anteil übernehmen */
function rFold(){if(!rs)return;if(!rs.mine)rs.mine={};if(!rs.view)rs.view={};const ks=new Set([...Object.keys(rs.items||{}),...Object.keys(rs.view)]);
 ks.forEach(k=>{const a=rs.items[k],b=rs.view[k],d=(a?+a.q||0:0)-(b?+b.q||0:0);if(!d)return;const m={...(rs.mine[k]||{}),...(a||b)};rLogPush(k,a||b,d);m.q=(rs.mine[k]?+rs.mine[k].q||0:0)+d;if(m.q)rs.mine[k]=m;else delete rs.mine[k]});
 rs.view=rCp(rs.items)}
/* Änderungen anderer in den offenen Schein übernehmen */
function rRemote(){if(!rs||!rs.id)return;const r=rets.find(x=>x.id===rs.id);if(!r)return;rFold();const t=rOthers(r);rAddTo(t,rs.mine);rs.items=rPos(t);rs.view=rCp(rs.items);
 if(rs.h0)["ev","ord","rem"].forEach(f=>{const loc=String(rs[f]||""),rem=String(r[f]||"");if(loc===String(rs.h0[f]||"")&&rem!==loc)rs[f]=rem});
 rs.h0={ev:r.ev||"",ord:r.ord||"",rem:r.rem||""}}
/* Hinweis: wer arbeitet gerade noch an diesem Schein */
function rWhoL(r){const n=Date.now();return r?Object.keys(r).filter(k=>k.startsWith("ed_")&&k!=="ed_"+me&&n-(+r[k]||0)<90000).map(k=>r["edn_"+k.slice(3)]?shortName(r["edn_"+k.slice(3)])+" (Tablet)":nm(k.slice(3))):[]}
function rWho(){const L=rWhoL(rs&&rs.id&&rets.find(x=>x.id===rs.id));return L.length?'<div class="rwho"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.8"/><path d="M17 14.5c2.5.2 4.1 1.9 4.5 5"/></svg><span>'+esc(L.join(", "))+(L.length>1?" arbeiten":" arbeitet")+' gerade auch an diesem Schein. Eure Mengen werden zusammengezählt.</span></div>':""}
let rHbId=null,rHbLast=0;
function rHb(){const id=rs&&rs.id&&view==="retedit"&&document.visibilityState==="visible"&&rets.find(x=>x.id===rs.id)?rs.id:null;
 if(rHbId&&rHbId!==id){db.doc("retour/"+rHbId).update({["ed_"+me]:0}).catch(()=>{});rHbLast=0}
 if(id&&(id!==rHbId||Date.now()-rHbLast>30000)){rHbLast=Date.now();db.doc("retour/"+id).update({["ed_"+me]:Date.now(),...(tabOn()&&TAB.act?{["edn_"+me]:TAB.act.name}:{})}).catch(()=>{})}
 rHbId=id}

function sndSel(ok){const L=SND[ok?"ok":"err"];let v=null;try{v=localStorage.getItem("tpc_snd_"+(ok?"ok":"err"))}catch(e){}return L.find(x=>x.id===v)||L[0]}

function sndPlay(tones){try{if(!ACX)return;if(ACX.state==="suspended")ACX.resume();const t=ACX.currentTime+.01;
 tones.forEach(([f,s,d,w,v,f2,dec])=>{const o=ACX.createOscillator(),g=ACX.createGain();o.type=w;o.frequency.setValueAtTime(f,t+s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+s+d);
  g.gain.setValueAtTime(0,t+s);g.gain.linearRampToValueAtTime(v,t+s+.01);if(dec){g.gain.exponentialRampToValueAtTime(.001,t+s+d)}else{g.gain.setValueAtTime(v,t+s+d-.03);g.gain.linearRampToValueAtTime(0,t+s+d)}
  o.connect(g).connect(ACX.destination);o.start(t+s);o.stop(t+s+d+.02)})}catch(e){}}
function beep(ok){try{if(navigator.vibrate&&pref("vib"))navigator.vibrate(ok?60:[120,80,120]);if(!ACX||!pref("snd"))return;sndPlay(sndSel(ok).t)}catch(e){}}

 return '<div class="card" style="margin-bottom:8px"><b>Töne auswählen</b><span class="mute" style="display:block;font-size:13px">Antippen spielt den Ton und wählt ihn aus.</span>'+grp(true,"Bei richtig erkanntem Artikel")+grp(false,"Bei Fehler")+'</div>'}
function sndBind(){document.querySelectorAll("[data-sid]").forEach(b=>b.onclick=()=>{const ok=b.dataset.sok==="1";audioUnlock();sndSet(ok,b.dataset.sid);sndPlay(sndSel(ok).t);document.querySelectorAll('[data-sok="'+b.dataset.sok+'"]').forEach(x=>x.classList.toggle("on",x===b))})}

let WL=null;

/* Packliste (epirent) auslesen: aus den Textstücken des PDFs (pdf.js) die Kopfdaten und Positionen holen.
   Gespeichert wird nur: Auftragsnummer, Packscheinnummer, Veranstaltung, Projektleiter, Zeiten, Positionen (Anzahl, Bezeichnung, Artikelnummer, Fremd).
   Kunde/Adresse (links oben) und Fußzeile werden bewusst NICHT übernommen.
   Eingabe: [{p:Seite, x, y, s:Text}]  (y wächst nach oben, wie im PDF) */
function pkParse(items){
 const L=[];
 items.filter(i=>i&&String(i.s).trim()).slice().sort((a,b)=>a.p-b.p||b.y-a.y).forEach(i=>{const r=L[L.length-1],t={x:i.x,s:String(i.s).replace(/\s+/g," ").trim()};
  if(r&&r.p===i.p&&Math.abs(r.y-i.y)<=2.5)r.it.push(t);else L.push({p:i.p,y:i.y,it:[t]})});
 L.forEach(r=>r.it.sort((a,b)=>a.x-b.x));
 const lab=(r,re)=>{const i=r.it.findIndex(t=>re.test(t.s));return i<0?null:i};

   (Personen mit rolle.tl = "am Lager-Tablet") + "Anderer Name …" für Helfer ohne Konto (bis Ende der Woche gemerkt, nur auf dem Gerät).
   Rechte bleiben die des Tablet-Kontos. Der gewählte Name wird beim Speichern als <feld>_as mitgeschrieben (build.py hängt
   ...tabAs("by") usw. an jedes by:me/mod:me/…) und überall als "Name (Tablet)" angezeigt (nmA). */
/* Namen überall kurz: Vorname + erster Buchstabe des Nachnamens + Punkt (Jürgen Hartmann -> Jürgen H.) */
function shortName(n){n=String(n||"").trim().replace(/\s+/g," ");if(!n)return "";const p=n.split(" ");return p.length<2?n:p[0]+" "+p[p.length-1].charAt(0).toUpperCase()+"."}
const TAB={act:null,last:0,shown:false,names:{}};
const TAB_IDLE=30*60e3,TAB_KEY="tpc_tab_act",TAB_HLP="tpc_tab_helpers";
const tabOn=()=>!!(typeof ROL!=="undefined"&&me&&ROL[me]&&ROL[me].tab===true);
function tabAs(k){return tabOn()&&TAB.act&&TAB.act.name?{[k+"_as"]:TAB.act.name}:{}}
function nmA(o,k){if(!o)return nm(undefined);const a=o[k+"_as"];return a?shortName(a)+" (Tablet)":nm(o[k])}
const meName=()=>shortName(tabOn()&&TAB.act?TAB.act.name:(names[me]||""));
function tabLS(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function tabWeekEnd(){const d=new Date();d.setHours(23,59,59,0);d.setDate(d.getDate()+(7-d.getDay())%7);return d.getTime()}
function tabHelpers(){const now=Date.now(),L=(tabLS(TAB_HLP)||[]).filter(h=>h&&h.n&&h.exp>now);tabLS(TAB_HLP,L);return L}
function tabPeople(){return Object.keys(ROL).filter(id=>ROL[id]&&ROL[id].tl===true&&id!==me)}
async function tabLoadNames(){const ids=tabPeople().filter(id=>!names[id]);if(!ids.length)return;try{const {data}=await SB.from("profiles").select("id,name").in("id",ids);(data||[]).forEach(p=>{if(p.name)names[p.id]=p.name})}catch(e){}}
function tabSet(a){TAB.act=a;TAB.last=Date.now();tabLS(TAB_KEY,a?{...a,t:TAB.last}:null);const o=$("#tabov");if(o)o.remove();TAB.shown=false;draw()}

function tabHead(){const w=$("#who");if(!w)return;if(!tabOn()){w.textContent=shortName(names[me]||"");return}
 w.innerHTML=esc(TAB.act?shortName(TAB.act.name):"Lager-Tablet")+' <button type="button" id="tabsw" class="tabsw">Wechseln</button>';const b=$("#tabsw");if(b)b.onclick=e=>{e.stopPropagation();tabPick(true)}}

 const ini=n=>String(n).trim().split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase();
 o.innerHTML='<div class="tabbox"><h2>Wer arbeitet gerade?</h2><p class="mute">Lager-Tablet · Name antippen</p><div class="tabgrid">'+
  P.map(p=>'<button type="button" class="tabt" data-tbu="'+esc(p.id)+'"><span class="tabi">'+esc(ini(p.name))+'</span><b>'+esc(p.name)+'</b></button>').join("")+
  H.map((h,i)=>'<button type="button" class="tabt hlp" data-tbh="'+i+'"><span class="tabi">'+esc(ini(h.n))+'</span><b>'+esc(shortName(h.n))+'</b><small>Helfer</small></button>').join("")+
  '<button type="button" class="tabt other" id="tbother"><span class="tabi">+</span><b>Anderer Name …</b></button></div>'+
  (P.length?'':'<p class="mute" style="margin-top:12px">Noch keine Namen freigegeben. Der Admin hakt in der Benutzerverwaltung bei den Kollegen „am Lager-Tablet“ an.</p>')+
  '<div id="tbin" class="tabin" hidden><label for="tbname">Name</label><input id="tbname" maxlength="40" autocomplete="off" placeholder="Vor- und Nachname"><div class="row"><button type="button" class="btn ghost" id="tbx">Abbrechen</button><button type="button" class="btn" id="tbok">Weiter</button></div><p class="mute" style="font-size:13px;margin:6px 0 0">Der Name bleibt bis Ende der Woche als Kachel auf diesem Tablet.</p></div>'+
  (TAB.act&&force?'<button type="button" class="lnk" id="tbback" style="margin-top:10px">Zurück (weiter als '+esc(shortName(TAB.act.name))+')</button>':'')+'</div>';
 o.querySelectorAll("[data-tbu]").forEach(b=>b.onclick=()=>tabSet({id:b.dataset.tbu,name:names[b.dataset.tbu]||"?"}));

 const ok=()=>{const n=inp.value.trim().replace(/\s+/g," ");if(n.length<2)return inp.classList.add("bad");const L=tabHelpers().filter(h=>h.n.toLowerCase()!==n.toLowerCase());L.push({n,exp:tabWeekEnd()});tabLS(TAB_HLP,L);tabSet({name:n,helper:true})};
 o.querySelector("#tbok").onclick=ok;inp.onkeydown=e=>{if(e.key==="Enter")ok()};
 const bk=o.querySelector("#tbback");if(bk)bk.onclick=()=>{o.remove();TAB.shown=false;TAB.last=Date.now()}}
/* Prüfen: beim Start, nach Rechte-Änderung, jede halbe Minute */
function tabCheck(){if(!tabOn()){if(TAB.act){TAB.act=null}const o=$("#tabov");if(o)o.remove();TAB.shown=false;return}
 if(!TAB.act){const s=tabLS(TAB_KEY);if(s&&s.name&&Date.now()-(s.t||0)<TAB_IDLE){TAB.act={id:s.id,name:s.name,helper:!!s.helper};TAB.last=s.t}}
 if(!TAB.act||Date.now()-TAB.last>TAB_IDLE){if(TAB.act){TAB.act=null;tabLS(TAB_KEY,null);draw()}tabPick(false)}}
let tabTouch=0;
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{if(!TAB.act)return;const n=Date.now();if(n-TAB.last>TAB_IDLE)return tabCheck();TAB.last=n;if(n-tabTouch>20e3){tabTouch=n;tabLS(TAB_KEY,{...TAB.act,t:n})}},{passive:true,capture:true}));
setInterval(()=>{if(typeof me!=="undefined"&&me)tabCheck()},30e3);

/* ===== Frag Jarvis (ab 1.68) – feste Fragen ohne KI =====

   (nur was die Person sehen darf). Antwort als Text + gesprochen (eingestellte Stimme/Sprechart), Knöpfe zum Öffnen. */
let jvMode="brief",jvRec=null,jvRecOn=false,jvLast=null,jvMicDead=false;

function jvAskHtml(){return '<div class="jvask"><div class="jvaskrow">'+

 '<input id="jvaq" type="search" enterkeyhint="send" autocomplete="off" placeholder="Frag mich … z. B. „Hilfe“" aria-label="Frage an den Lager Assistenten">'+
 '<button class="jvgo" id="jvgo" type="button">Fragen</button></div><div class="jvms" id="jvms" aria-live="polite"></div><div class="jvans" id="jvans" aria-live="polite"></div></div>'}

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mb=$("#jvmic");if(SR&&mb){mb.hidden=false;mb.onclick=()=>jvListen(SR)}
 if(jvLast)jvShow(jvLast,false)}
/* Zuhören. iPhone/Safari gibt die Erkennung nach einem Ergebnis oft nicht frei (kein onend) -> eine zweite Frage ging erst nach
   Neustart. Darum: alte Erkennung immer hart beenden (abort), nach dem Endergebnis selbst stoppen, Frage erst nach dem Ende
   (oder spätestens nach 1,2 s) stellen, bei "läuft noch" einmal neu versuchen. */
let jvRecTxt="",jvRecT=null;
function jvRecUi(on){const mb=$("#jvmic"),q=$("#jvaq");if(mb)mb.classList.toggle("on",on);if(q)q.placeholder=on?"Ich höre zu …":"Frag mich … z. B. „Hilfe“"}
function jvRecKill(){const r=jvRec;jvRec=null;jvRecOn=false;clearTimeout(jvRecT);if(r){r.onresult=r.onerror=r.onend=null;try{r.abort()}catch(e){}}}
function jvRecDone(){if(!jvRecOn&&!jvRecTxt)return;const t=jvRecTxt.trim();jvRecTxt="";jvRecKill();jvRecUi(false);jvAudioBack();jvMs("");if(t)setTimeout(()=>jvAsk(t),150)}
let jvRecUsed=false;const jvRecGot=()=>{jvRecUsed=true};
/* Status-Zeile unter dem Eingabefeld: was das Mikrofon meldet (zur Fehlersuche am iPhone) */
function jvMs(t){const m=$("#jvms");if(m)m.textContent=t||""}
/* Ton freigeben, bevor das Mikrofon startet: iPhone blockiert das Mikrofon, solange noch ein Audio-Element "spielt" oder geladen ist */
function jvFreeAudio(){try{speechSynthesis.cancel()}catch(e){}if(jvAud){try{jvAud.pause();jvAud.removeAttribute("src");jvAud.load()}catch(e){}}
 try{if(navigator.audioSession)navigator.audioSession.type="play-and-record"}catch(e){}}
function jvAudioBack(){try{if(navigator.audioSession)navigator.audioSession.type="auto"}catch(e){}}
function jvKbdMic(){const q=$("#jvaq");if(q){q.value="";q.focus()}jvMs("Am iPhone geht das Mikrofon der App nur einmal pro Start. Jetzt auf der Tastatur das Mikrofon (unten rechts) antippen, sprechen, dann „Fragen“.")}
function jvListen(SR){if(jvIOS&&jvMicDead&&!jvRecOn)return jvKbdMic();if(jvRecOn){if(jvRecTxt)return jvRecDone();jvRecKill();jvRecUi(false);jvMs("");return}
 jvSpeaking=false;jvTalk(false);jvFreeAudio();jvRecKill();
 /* start() muss direkt im Antippen passieren (iPhone) – kein verzögerter zweiter Versuch, sondern sofort mit neuer Erkennung */
 const mk=()=>{const r=new SR();r.lang="de-AT";r.interimResults=true;r.continuous=false;r.maxAlternatives=1;return r};
 let r,err="";for(let i=0;i<2&&!r;i++){try{const x=mk();x.start();r=x}catch(e){err=(e&&(e.name||e.message))||"Fehler";jvRecKill()}}
 if(!r){jvRecUi(false);jvAudioBack();jvMs("Mikrofon startet nicht ("+err+"). Bitte die Frage eintippen.");return}
 jvRec=r;jvRecTxt="";jvRecOn=true;jvRecUi(true);jvMs("Ich höre zu …");const q=$("#jvaq");if(q)q.value="";
 const off=()=>{jvRecUi(false);jvAudioBack()};
 r.onaudiostart=()=>{if(jvRec===r)jvMs("Mikrofon an – sprich jetzt.")};
 r.onresult=e=>{if(jvRec!==r)return;let t="",fin=false;for(const x of e.results){t+=x[0].transcript;if(x.isFinal)fin=true}jvRecTxt=t;if(q)q.value=t;

 r.onerror=e=>{if(jvRec!==r)return;const er=(e&&e.error)||"unbekannt";const t=jvRecTxt;jvRecKill();off();if(t){jvMs("");return setTimeout(()=>jvAsk(t),150)}

 const dead=m=>{jvRecKill();off();if(jvIOS&&jvRecUsed){jvMicDead=true;jvMs("Das iPhone liefert dem Mikrofon der App keinen Ton mehr (geht nur einmal pro Start). Tippe nochmal aufs Mikrofon – dann nehmen wir das Tastatur-Mikrofon.")}else jvMs(m)};
 r.onend=()=>{if(jvRec!==r)return;if(jvRecTxt){jvMs("");jvRecGot();jvRecDone()}else dead("Mikrofon wurde beendet, ohne etwas zu hören. Nochmal tippen.")};
 jvRecT=setTimeout(()=>{if(jvRec===r&&!jvRecTxt)dead("Nichts gehört. Nochmal aufs Mikrofon tippen.")},12000)}
/* Antwort anzeigen + sprechen. A = {q, say:[Sätze], rows:[{l,r,pk?,ret?,cls?}], acts:[{l,fn}]} */
/* ---- Hilfen ---- */
const jvDayName=t=>{const d=pkDay(Date.now()),x=Math.round((t-d)/864e5);return x===0?"heute":x===1?"morgen":x===-1?"gestern":PK_WD[new Date(t).getDay()]+" "+pkDM(t)};
function jvPacksVisible(){return can("pk_s")?packs:[]}
function jvPkRow(p,extra){const g=pkProg(p);return{l:(p.ev||p.ord||"Packliste")+(p.ord?" · "+p.ord:""),r:extra||(g.fin?"hergerichtet ✓":g.d?g.d+"/"+g.n:"offen"),pk:p.id,cls:g.fin?"ok":g.d?"ok":"warn"}}
function jvFindPacks(q){const n=jvNorm(q),dig=(n.match(/\d{6,}/)||[""])[0],P=jvPacksVisible();
